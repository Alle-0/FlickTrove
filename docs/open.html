  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --accent: #2DD4BF;
      --accent-secondary: #0D9488;
      --accent-gradient: linear-gradient(135deg, var(--accent), var(--accent-secondary));
      --accent-dim: rgba(45, 212, 191, 0.16);
      --accent-glow: rgba(45, 212, 191, 0.35);
      --accent-border: rgba(45, 212, 191, 0.28);
      --type-badge-bg: rgba(45, 212, 191, 0.16);
      --bg: #0B0F19;
      --surface: rgba(16, 22, 34, 0.72);
      --surface-hover: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.09);
      --text: #FFFFFF;
      --text-dim: rgba(255, 255, 255, 0.65);
      --text-muted: rgba(255, 255, 255, 0.38);
      --radius: 24px;
      --radius-sm: 14px;
    }

    html,
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient backdrop with smooth dynamic poster reflection */
    .ambient-backdrop {
      position: fixed;
      inset: -60px;
      background-size: cover;
      background-position: center 25%;
      filter: blur(80px) saturate(180%) brightness(0.4);
      opacity: 0;
      transform: scale(1.15);
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      z-index: 0;
    }

    .ambient-backdrop.loaded {
      opacity: 0.55;
      transform: scale(1.04);
    }

    .ambient-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 35%, rgba(11, 15, 25, 0.25) 0%, rgba(11, 15, 25, 0.85) 70%, #0B0F19 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* Animated gradient orbs responsive to extracted palette */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(110px);
      opacity: 0.32;
      pointer-events: none;
      z-index: 0;
      animation: float 10s ease-in-out infinite;
      transition: background 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .bg-orb-1 {
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, var(--accent), transparent 70%);
      top: -140px;
      left: -120px;
      animation-delay: 0s;
    }

    .bg-orb-2 {
      width: 440px;
      height: 440px;
      background: radial-gradient(circle, var(--accent-secondary), transparent 70%);
      bottom: -100px;
      right: -100px;
      animation-delay: -5s;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0px) scale(1);
      }

      50% {
        transform: translateY(-30px) scale(1.06);
      }
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      gap: 32px;
    }

    /* Top bar */
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 100px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      transition: background 0.2s, transform 0.2s;
    }

    .brand:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-1px);
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
    }

    .brand-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.2px;
    }

    /* Main card with dynamic glow */
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--accent-border);
      border-radius: var(--radius);
      overflow: hidden;
      -webkit-backdrop-filter: blur(28px);
      backdrop-filter: blur(28px);
      box-shadow: 0 32px 64px rgba(0, 0, 0, 0.55), 0 0 60px var(--accent-glow);
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
      transition: border-color 0.8s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(28px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Poster area with reflection shine */
    .poster-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: linear-gradient(135deg, #131826, #090D15);
      overflow: hidden;
    }

    .poster-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      transform: scale(1.05);
      transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease;
    }

    .poster-img.loaded {
      display: block;
      transform: scale(1);
    }

    .poster-shine {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0) 45%);
      pointer-events: none;
      z-index: 1;
    }

    .poster-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--text-muted);
    }

    .poster-placeholder svg {
      opacity: 0.4;
    }

    .poster-gradient {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65%;
      background: linear-gradient(to top, rgba(16, 22, 34, 0.98), transparent);
      z-index: 2;
    }

    /* Badge type */
    .type-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      background: var(--type-badge-bg);
      border: 1px solid var(--accent-border);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      border-radius: 100px;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.6px;
      text-transform: uppercase;
      z-index: 3;
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Card body */
    .card-body {
      position: relative;
      padding: 22px 24px 26px;
      z-index: 3;
    }

    .content-title {
      font-size: 23px;
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.4px;
      color: var(--text);
      min-height: 28px;
      margin-bottom: 6px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .content-meta {
      font-size: 13px;
      color: var(--text-dim);
      min-height: 18px;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Skeleton loading */
    .skeleton {
      background: linear-gradient(90deg,
          rgba(255, 255, 255, 0.05) 25%,
          rgba(255, 255, 255, 0.12) 50%,
          rgba(255, 255, 255, 0.05) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }

    @keyframes shimmer {
      0% {
        background-position: 200% 0;
      }

      100% {
        background-position: -200% 0;
      }
    }

    /* CTA buttons */
    .cta-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-primary {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--accent-gradient);
      color: #070B12;
      font-size: 15px;
      font-weight: 700;
      padding: 15px 22px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.25s, opacity 0.2s;
      letter-spacing: -0.2px;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .btn-primary svg {
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px var(--accent-glow);
    }

    .btn-primary:hover svg {
      transform: translateX(3px);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--surface-hover);
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 500;
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.18);
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-muted);
      font-size: 12px;
      text-transform: lowercase;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Footer note */
    .footnote {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.6;
      max-width: 380px;
    }

    .footnote a {
      color: var(--accent);
      text-decoration: none;
      transition: color 0.2s;
    }

    .footnote a:hover {
      text-decoration: underline;
    }

    /* Error state */
    .error-state {
      display: none;
    }

    .error-state.visible {
      display: block;
    }
  </style>
</head>

    // --- Dynamic Color Extraction from Poster ---
    function hslToRgb(h, s, l) {
      const c = (1 - Math.abs(2 * l - 1)) * s;
      const x = c * (1 - Math.abs((h / 60) % 2 - 1));
      const m = l - c / 2;
      let r = 0, g = 0, b = 0;
      if (h >= 0 && h < 60) { r = c; g = x; b = 0; }
      else if (h >= 60 && h < 120) { r = x; g = c; b = 0; }
      else if (h >= 120 && h < 180) { r = 0; g = c; b = x; }
      else if (h >= 180 && h < 240) { r = 0; g = x; b = c; }
      else if (h >= 240 && h < 300) { r = x; g = 0; b = c; }
      else { r = c; g = 0; b = x; }
      return {
        r: Math.round((r + m) * 255),
        g: Math.round((g + m) * 255),
        b: Math.round((b + m) * 255)
      };
    }

    function applyDynamicPalette(c) {
      // Harmonic secondary color with soft hue rotation (+26 deg)
      const h2 = (c.h + 26) % 360;
      const s2 = Math.min(1, c.s * 1.05);
      const l2 = Math.max(0.35, Math.min(0.65, c.l * 0.9));
      const c2 = hslToRgb(h2, s2, l2);

      const r = c.r, g = c.g, b = c.b;
      const root = document.documentElement;

      root.style.setProperty('--accent', `rgb(${r}, ${g}, ${b})`);
      root.style.setProperty('--accent-secondary', `rgb(${c2.r}, ${c2.g}, ${c2.b})`);
      root.style.setProperty('--accent-gradient', `linear-gradient(135deg, rgb(${r}, ${g}, ${b}), rgb(${c2.r}, ${c2.g}, ${c2.b}))`);
      root.style.setProperty('--accent-dim', `rgba(${r}, ${g}, ${b}, 0.18)`);
      root.style.setProperty('--accent-glow', `rgba(${r}, ${g}, ${b}, 0.38)`);
      root.style.setProperty('--accent-border', `rgba(${r}, ${g}, ${b}, 0.32)`);
      root.style.setProperty('--type-badge-bg', `rgba(${r}, ${g}, ${b}, 0.22)`);

      // Update mobile Android browser status bar theme color
      const metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) {
        const darkR = Math.round(r * 0.12 + 10);
        const darkG = Math.round(g * 0.12 + 14);
        const darkB = Math.round(b * 0.12 + 22);
        metaTheme.setAttribute('content', `rgb(${darkR}, ${darkG}, ${darkB})`);
      }
    }

    function extractPaletteAndStyle(img) {
      try {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        if (!ctx) return;

        const size = 48;
        canvas.width = size;
        canvas.height = size;
        ctx.drawImage(img, 0, 0, size, size);
        const imgData = ctx.getImageData(0, 0, size, size).data;

        let bestColor = null;
        let maxScore = -1;
        let sumR = 0, sumG = 0, sumB = 0, validCount = 0;

        for (let i = 0; i < imgData.length; i += 4) {
          const r = imgData[i];
          const g = imgData[i + 1];
          const b = imgData[i + 2];
          const a = imgData[i + 3];

          if (a < 128) continue;

          // RGB -> HSL
          const rn = r / 255, gn = g / 255, bn = b / 255;
          const max = Math.max(rn, gn, bn), min = Math.min(rn, gn, bn);
          const l = (max + min) / 2;
          const d = max - min;
          const s = d === 0 ? 0 : (l > 0.5 ? d / (2 - max - min) : d / (max + min));

          sumR += r; sumG += g; sumB += b;
          validCount++;

          // Skip overly dark, washed-out or pure white pixels
          if (l < 0.16 || l > 0.88 || s < 0.18) continue;

          // Hue in degrees
          let h = 0;
          if (d !== 0) {
            switch (max) {
              case rn: h = ((gn - bn) / d + (gn < bn ? 6 : 0)) * 60; break;
              case gn: h = ((bn - rn) / d + 2) * 60; break;
              case bn: h = ((rn - gn) / d + 4) * 60; break;
            }
          }

          // Aesthetic cinematic vibrance score
          const score = (s * 2.6) + (1 - Math.abs(l - 0.52) * 1.8);
          if (score > maxScore) {
            maxScore = score;
            bestColor = { r, g, b, h, s, l };
          }
        }

        if (!bestColor && validCount > 0) {
          const rAvg = Math.round(sumR / validCount);
          const gAvg = Math.round(sumG / validCount);
          const bAvg = Math.round(sumB / validCount);
          bestColor = { r: rAvg, g: gAvg, b: bAvg, h: 174, s: 0.65, l: 0.5 };
        }

        if (bestColor) {
          applyDynamicPalette(bestColor);
        }
      } catch (e) {
        // Safe fallback if cross-origin canvas security triggers
      }
    }

    function setPoster(fullUrl) {
      posterImg.crossOrigin = 'anonymous';
      posterImg.src = fullUrl;

      if (ambientBackdrop) {
        ambientBackdrop.style.backgroundImage = `url("${fullUrl}")`;
        ambientBackdrop.classList.add('loaded');
      }

      posterImg.onload = () => {
        posterImg.classList.add('loaded');
        posterPh.style.display = 'none';
        extractPaletteAndStyle(posterImg);
      };
      posterImg.onerror = () => { /* keep placeholder */ };
    }

    // --- Fetch metadata from TMDB or URL params ---
    async function fetchTmdb() {
      if (type === 'folder' || code) return;
      if (!id) { showFallback(i18n.invalid_link); return; }

      if (t) {
        titleEl.textContent = t;
        titleEl.classList.remove('skeleton');
        titleEl.style.width = '';
        titleEl.style.height = '';
        document.title = `${t} — FlickTrove`;

        metaEl.textContent = i18n.fallback_meta;
        metaEl.classList.remove('skeleton');
        metaEl.style.width = '';
        metaEl.style.height = '';
      }

      if (p) {
        const fullPoster = p.startsWith('http') ? p : `${TMDB_IMAGE_BASE}w500${p}`;
        setPoster(fullPoster);
      }

      // If we have enough data from URL, or if this is a non-numeric editorial collection (Firestore)
      const isNonNumericId = !/^\d+$/.test(id);
      if ((t && p) || isNonNumericId) {
        if (!t && isNonNumericId) {
          titleEl.textContent = id.replace(/[-_]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
          titleEl.classList.remove('skeleton');
          titleEl.style.width = titleEl.style.height = '';
        }
        return;
      }

      try {
        let endpoint = '';
        if (type === 'movie') endpoint = `/movie/${id}?language=${i18n.tmdb_lang}`;
        if (type === 'tv') endpoint = `/tv/${id}?language=${i18n.tmdb_lang}`;
        if (type === 'person') endpoint = `/person/${id}?language=${i18n.tmdb_lang}`;
        if (type === 'collection') endpoint = `/collection/${id}?language=${i18n.tmdb_lang}`;

        const res = await fetch(`${TMDB_API_BASE}${endpoint}`, {
          headers: TMDB_READ_TOKEN
            ? { 'Authorization': `Bearer ${TMDB_READ_TOKEN}` }
            : {}
        });

        if (!res.ok) { showFallback(); return; }
        const data = await res.json();

        // Title
        const title = data.title || data.name || i18n.fallback_title;
        titleEl.textContent = title;
        titleEl.classList.remove('skeleton');
        titleEl.style.width = '';
        titleEl.style.height = '';

        // Meta (year + genres or known_for or collection parts)
        let metaText = '';
        if (data.release_date) metaText = data.release_date.slice(0, 4);
        if (data.first_air_date) metaText = data.first_air_date.slice(0, 4);
        if (data.genres?.length) metaText += (metaText ? ' · ' : '') + data.genres.slice(0, 2).map(g => g.name).join(', ');
        if (data.known_for_department) metaText = data.known_for_department;
        if (type === 'collection' && data.parts?.length) metaText = `${data.parts.length} ${i18n.collection_parts}`;
        metaEl.textContent = metaText;
        metaEl.classList.remove('skeleton');
        metaEl.style.width = '';
        metaEl.style.height = '';

        // Poster
        const posterPath = data.poster_path || data.profile_path;
        if (posterPath) {
          setPoster(`${TMDB_IMAGE_BASE}w500${posterPath}`);
        }

        // Update page title + OG
        document.title = `${title} — FlickTrove`;

      } catch (e) {
        showFallback();
      }
    }

    function showFallback(msg) {
      titleEl.textContent = i18n.fallback_title;
      titleEl.classList.remove('skeleton');
      metaEl.textContent = msg || i18n.fallback_meta;
      metaEl.classList.remove('skeleton');
      titleEl.style.width = metaEl.style.width = '';
      titleEl.style.height = metaEl.style.height = '';
    }

    fetchTmdb();
  </script>
